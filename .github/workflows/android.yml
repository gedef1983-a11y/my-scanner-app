name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3-dev libffi-dev libssl-dev cmake openjdk-17-jdk zip unzip zlib1g-dev autoconf libtool pkg-config
          pip install --upgrade pip
          pip install "cython<3.0.0" buildozer

      - name: Build with Buildozer
        run: |
          # 1. Первый проход: заставляем Buildozer создать структуру папок SDK
          # Он может упасть на лицензиях, это нормально (используем || true)
          buildozer android debug || true
          
          # 2. Динамический поиск sdkmanager (исправляет ошибку "does not exist")
          SDK_DIR="/home/runner/.buildozer/android/platform/android-sdk"
          SDK_MANAGER=$(find /home/runner/.buildozer -name "sdkmanager" | head -n 1)
          
          # 3. Если менеджер найден, принимаем лицензии напрямую
          if [ -n "$SDK_MANAGER" ]; then
            echo "Found sdkmanager at $SDK_MANAGER. Accepting licenses..."
            yes | $SDK_MANAGER --sdk_root=$SDK_DIR --licenses || true
          fi

          # 4. Создаем файлы-маркеры лицензий для надежности
          mkdir -p $SDK_DIR/licenses
          echo -e "8933bad161af4178b1185d1a37fbf41ea5269c55\nd5624a996839a99227e5965bea033f5a77528159\n24333f8a63b6825ea9c5573f8435929d00fca03a" > $SDK_DIR/licenses/android-sdk-license
          
          # 5. Финальный запуск сборки
          buildozer android debug
        env:
          ACCEPT_SDK_LICENSE: "yes"
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx2048m"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WarehouseScanner-APK
          path: bin/*.apk
          
