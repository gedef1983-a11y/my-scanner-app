name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            python3-dev \
            generate-secrets \
            libffi-dev \
            libssl-dev \
            cmake \
            ant \
            python3-setuptools \
            openjdk-17-jdk \
            zip \
            unzip \
            zlib1g-dev \
            libltdl-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.33 kivy[base]

      - name: Build with Buildozer
        run: |
          yes | buildozer android debug
        env:
          ACCEPT_SDK_LICENSE: "yes"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WarehouseScanner-APK
          path: bin/*.apk
          
