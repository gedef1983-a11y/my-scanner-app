name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3-dev libffi-dev libssl-dev cmake openjdk-17-jdk zip unzip zlib1g-dev autoconf libtool pkg-config
          pip install --upgrade pip
          pip install "cython<3.0.0" buildozer

      - name: Setup Android SDK Path
        run: |
          # Принимаем лицензии
          yes | sdkmanager --sdk_root=$ANDROID_HOME --licenses || true
          # Находим путь к aidl и добавляем в PATH
          AIDL_PATH=$(find $ANDROID_HOME/build-tools -name "aidl" | head -n 1)
          echo "$(dirname $AIDL_PATH)" >> $GITHUB_PATH

      - name: Build with Buildozer
        run: |
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          buildozer android debug
        env:
          ACCEPT_SDK_LICENSE: "yes"
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WarehouseScanner-APK
          path: bin/*.apk
          
